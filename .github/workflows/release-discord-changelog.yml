name: Discord changelog

on:
  # Releases created with GITHUB_TOKEN do not trigger release events.
  # release.yml calls this workflow explicitly after publishing.
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      DISCORD_CHANGELOG_WEBHOOK:
        required: true
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to test. Leave blank to use the latest release.
        required: false
        type: string

permissions:
  contents: read

jobs:
  discord-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Post release changelog to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG:-}" ]; then
            node scripts/release-notes/discord-release-summary.cjs \
              --tag "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --post
          else
            node scripts/release-notes/discord-release-summary.cjs \
              --latest \
              --repo "$GITHUB_REPOSITORY" \
              --post
          fi
